# docker compose up --build                 -> app only (extractive mode works immediately)
# docker compose --profile llm up --build   -> app + a local Ollama server
#   then: docker compose exec ollama ollama pull llama3.2
services:
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      SEARCH_PROVIDER: auto
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2
  ollama:
    image: ollama/ollama
    profiles: ["llm"]
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
volumes:
  ollama: {}
